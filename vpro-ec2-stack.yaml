---
- name: Setup Vprofile stack
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Import VPC setup variable
      include_vars: vars/vpc-output_vars

    - name: Import vprofile setup variable
      include_vars: vars/vprostacksetup

    - name: Create vprofile ec2 key
      ec2_key:
        name: vprokey
        region: "{{region}}"
      register: vprokey_out

    - name: Save private key into loginkey_vpro.pem
      copy:
        content: "{{vprokey_out.key.private_key}}"
        dest: "./loginkey_vpro.pem"
        mode: 0600
      when: vprokey_out.changed

    - name: Security Group for Load Balancer
      ec2_group:
        name: vproELB-sg
        description: Allow port 80 from everywhere and all port with sg
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        purge_rules: no
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
      register: vproELBSG_out

    - name: Security Group for EC2 stack
      ec2_group:
        name: vproStack-sg
        description: Allow port 80 from everywhere
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        purge_rules: no               # Idempotent
        rules:
          - proto: tcp
            from_port: 80
            to_port: 80
            group_id: "{{ vproELBSG_out.group_id }}"

          - proto: tcp
            from_port: 22
            to_port: 22
            group_id: "{{ BastionSGid }}"
      register: vproStackSG_out

    - name: Update Security Group with its own sg id
      ec2_group:
        name: vproStack-sg
        description: Allow port 80 from everywhere
        region: "{{ region }}"
        vpc_id: "{{ vpcid }}"
        purge_rules: no
        rules:
          - proto: all
            group_id: "{{vproStackSG_out.group_id}}"

    - name: Nginx EC2 Instance
      amazon.aws.ec2_instance:
        name: "web01"
        image_id: "{{ nginx_ami }}"
        instance_type: "t2.micro"
        region: "{{ region }}"
        vpc_subnet_id: "{{ privsub1id }}"
        key_name: "vprokey"
        security_group: "{{ vproStackSG_out.group_id }}"
        wait: true
        wait_timeout: 300
        tags:
          Name: "web01"
          Project: "Vprofile"
          Owner: "Devops Team"
      register: web01_out

    - name: Tomcat EC2 Instance
      amazon.aws.ec2_instance:
        name: "app01"
        image_id: "{{ tomcat_ami }}"
        instance_type: "t2.micro"
        region: "{{ region }}"
        vpc_subnet_id: "{{ privsub2id }}"
        key_name: "vprokey"
        security_group: "{{ vproStackSG_out.group_id }}"
        wait: true
        wait_timeout: 300
        tags:
          Name: "app01"
          Project: "Vprofile"
          Owner: "Devops Team"
      register: app01_out

    - name: Memcache EC2 Instance
      amazon.aws.ec2_instance:
        name: "mc01"
        image_id: "{{ memcache_ami }}"
        instance_type: "t2.micro"
        region: "{{ region }}"
        vpc_subnet_id: "{{ privsub3id }}"
        key_name: "vprokey"
        security_group: "{{ vproStackSG_out.group_id }}"
        wait: true
        wait_timeout: 300
        tags:
          Name: "mc01"
          Project: "Vprofile"
          Owner: "Devops Team"
      register: mc01_out

    - name: RabbitMQ EC2 Instance
      amazon.aws.ec2_instance:
        name: "rmq01"
        image_id: "{{ rmq_ami }}"
        instance_type: "t2.micro"
        region: "{{ region }}"
        vpc_subnet_id: "{{ privsub1id }}"
        key_name: "vprokey"
        security_group: "{{ vproStackSG_out.group_id }}"
        wait: true
        wait_timeout: 300
        tags:
          Name: "rmq01"
          Project: "Vprofile"
          Owner: "Devops Team"
      register: rmq01_out

    - name: MySQL EC2 Instance
      amazon.aws.ec2_instance:
        name: "db01"
        image_id: "{{ mysql_ami }}"
        instance_type: "t2.micro"
        region: "{{ region }}"
        vpc_subnet_id: "{{ privsub2id }}"
        key_name: "vprokey"
        security_group: "{{ vproStackSG_out.group_id }}"
        wait: true
        wait_timeout: 300
        tags:
          Name: "db01"
          Project: "Vprofile"
          Owner: "Devops Team"
      register: db01_out

    - debug:
        var: db01_out.instance_ids

    - name: Creating Load Balancer
      local_action:
        module: ec2_elb_lb
        name: "Vprofile-elb"
        region: "{{ region }}"
        state: "{{ state }}"
        instance_ids: "{{ web01_out.instance_ids }}"
        purge_instance_ids: true
        security_group_ids: "{{ vproELBSG_out.group_id }}"
        subnets: 
          - "{{ pubsub1id }}"
          - "{{ pubsub2id }}"
          - "{{ pubsub3id }}"
        listeners:
          - protocol: tcp
            load_balancer_port: 80
            instance_port: 80