- name: Setup MYSQL with accounts db and remote login
  hosts: dbsrvgrp
  gather_facts: no
  tasks:
    - name: Installing Mysql services and dependencies
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
        update_cache: yes
        cache_valid_time: 86400
      loop:
        - mysql-server
        - mysql-client
        - python-mysqldb
        - python3-mysqldb
        - libmysqlclient-dev
      ignore_errors: yes
      tags:
        - package

    - name: Start and enable mysql service
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: yes
      tags:
        - svc

    - name: Create mysql user
      mysql_user:
        name: "{{ dbuser }}"
        password: "{{ dbpass }}"
        priv: "*.*:ALL"
        host: "%"
        state: present
        column_case_sensitive: false

    - name: Creating accounts DB
      mysql_db:
        name: "{{ dbname }}"
        state: present

    - name: Enable remote login to mysql svc
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysql.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
        backup: yes
      notify:
        - Restart mysql
      tags:
        - conf

  handlers:
    - name: Restart mysql
      ansible.builtin.service:
        name: mysql
        state: restarted
