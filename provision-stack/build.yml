- name: Generate artifact, copy artifact and SQL file to files directory
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Install jdk, maven, git
      ansible.builtin.apt:
         name: "{{ item }}"
         state: present
         update_cache: yes
      loop:
        - git
        - maven
        - openjdk-8-jdk

    - name: Clone source code from github
      ansible.builtin.git:
        repo: 'https://github.com/devopshydclub/vprofile-repo.git'
        dest: ./Vprofile-repo
        version: vp-rem
      register: git_status

    - name: mvn install command to build artifact
      command: "mvn install"
      args:
        chdir: Vprofile-repo
      when: git_status.changed
      register: mvn_info

    - name: Copy artifact to files directory
      copy:
        src: "{{ item }}"
        dest: files/ROOT.war
      with_fileglob:
        - Vprofile-repo/target/*.war

    - name: Copy SQL file to the files directory
      copy:
        src: Vprofile-repo/src/main/resources/db_backup.sql 
        dest: files/db_backup.sql
